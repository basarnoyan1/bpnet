name: bpnet
channels:
- pytorch
- conda-forge
- bioconda
- defaults
dependencies:
- python=3.9
- git

# PyTorch ecosystem
- pytorch
- torchvision
- torchaudio
- captum

# Essential data science libraries
- numpy
- pandas=1.1.5 # Keep existing version constraint
- scikit-learn
- h5py=2.10.0 # Keep existing version constraint

# Bioinformatics libraries
- bioconda::pybedtools>=0.7.10
- bioconda::bedtools>=2.27.1 # Keep if still needed for data processing
- bioconda::pybigwig>=0.3.10
- bioconda::pysam>=0.14.0 # Keep if still needed
- bioconda::genomelake=0.1.4 # Check for PyTorch compatibility or replace if only for data loading

# Other utilities
- cython # Keep if needed for compiling any dependencies
- tqdm
- matplotlib
- pip=21.0.1 # Keep existing version constraint
- nb_conda=2.2.1 # Keep if Jupyter environment is used

# Kipoi and related (check compatibility with PyTorch)
- kipoi=0.6.25
- kipoiseq=0.3.4

# Optional/Specific use-cases (evaluate if still needed)
- fastparquet=0.5.0
- python-snappy=0.6.0

- pip:
  # If bpnet itself is being refactored to PyTorch, this direct git install might change or be removed.
  # For now, keeping it as is, assuming it might be a separate tool or version.
  - git+https://github.com/basarnoyan1/bpnet.git
